<!DOCTYPE html>
<html>
<body>

<button onclick="getCurTime()" type="button">Get current time position</button>
<button onclick="setCurTime()" type="button">Set time position to 5 seconds</button><br><br>

<audio id="myAudio" controls>
  <source src="sample.mp3" type="audio/mpeg">
  <source src="sample.ogg" type="audio/ogg">
  Your browser does not support the audio element.
</audio>

<script>
let aud = document.getElementById("myAudio");

function getCurTime() { 
  alert("Current time: " + aud.currentTime + " seconds");
} 

function setCurTime() { 
  aud.currentTime = 5;
} 
</script>

<p>Audio courtesy of <a href="https://www.soundhelix.com/examples" target="_blank">SoundHelix</a>.</p>

</body>
</html>
