<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .filter-section fieldset {
            padding: 1rem;
            border-radius: 1rem;
            border-color: white;
            color: white;
        }

        .filter-section fieldset>div {
            display: inline-block;
        }

        .filter-section input {
            display: none;
        }

        .filter-section label {
            display: flex;
            align-items: center;
            flex-direction: row;
            padding: 0.5rem 1rem 0.5rem 0.5rem;
            margin: 0 1rem 1rem 0;
            border-radius: 100rem;
            color: grey;
            box-shadow: 0 0 0 2px grey;
            transition: all 0.5s ease-in-out;
        }

        .filter-section label:before {
            content: "";
            background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgZmlsbD0iI2ZmZmZmZiIgdmlld0JveD0iMCAwIDI1NiAyNTYiPjxwYXRoIGQ9Ik0yMjkuNjYsNzcuNjZsLTEyOCwxMjhhOCw4LDAsMCwxLTExLjMyLDBsLTU2LTU2YTgsOCwwLDAsMSwxMS4zMi0xMS4zMkw5NiwxODguNjksMjE4LjM0LDY2LjM0YTgsOCwwLDAsMSwxMS4zMiwxMS4zMloiPjwvcGF0aD48L3N2Zz4=");
            background-position: center center;
            background-repeat: no-repeat;
            margin-right: 0.5rem;
            transition: all 0.5s ease-in-out;
            background-color: transparent;
            border-radius: 100rem;
            width: 1.5rem;
            height: 1.5rem;
        }

        .filter-section label:hover {
            cursor: pointer;
            box-shadow: 0 0 0 2px #167A93;
        }

        .filter-section label:hover:before {
            background-color: grey;
        }

        .filter-section input:checked+label {
            color: white;
            box-shadow: 0 0 0 2px #167A93;
        }

        .filter-section input:checked+label:before {
            background-color: #167A93;
        }
    </style>
</head>
<body>
    <div class="row filter-section">
                        <div class="col-md-8">
                            <div class="form-group">
                                <fieldset class="bg-dark">
                                    <legend>category:</legend>
                                    <div>
                                        <input type="checkbox" id="reading" value="reading" name="category"/>
                                        <label for="reading">Reading</label>
                                    </div>
                                    <div>
                                        <input type="checkbox" value="writing" id="writing" name="category" />
                                        <label for="writing">Writing</label>
                                    </div>
                                    <div>
                                        <input type="checkbox" value="speaking" id="speaking" name="category" />
                                        <label for="speaking">Speaking</label>
                                    </div>
                                    <div>
                                        <input type="checkbox" value="listening" id="listening" name="category" />
                                        <label for="listening">Listening</label>
                                    </div>
                                </fieldset>
                            </div>
                        </div>
                    </div>
</body>
</html>
