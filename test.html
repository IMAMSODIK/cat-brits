<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Card Transparan</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        padding: 40px;
    }

    .card {
        position: relative;
        width: 350px;
        height: 200px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        background-image: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee');
        background-size: cover;
        background-position: center;
    }

    /* Overlay transparan */
    .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.45); /* transparan */
    }

    .card-content {
        position: relative;
        z-index: 2;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #fff;
        text-align: center;
        padding: 20px;
    }

    .card-title {
        font-size: 22px;
        font-weight: bold;
        letter-spacing: 1px;
    }

    .card-subtitle {
        margin-top: 8px;
        font-size: 14px;
        opacity: 0.9;
    }
</style>
</head>
<body>

<div class="card">
    <div class="card-content">
        <div class="card-title">SELF DRIVE TOUR USA</div>
        <div class="card-subtitle">Listening & Reading Test</div>
    </div>
</div>

</body>
</html>
